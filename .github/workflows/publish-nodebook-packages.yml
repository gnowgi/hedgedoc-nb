name: Publish nodeBook packages to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package(s) to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - '@nodebook/core'
          - '@nodebook/react'
          - '@nodebook/dom'
          - '@nodebook/markdown-it'
      tag:
        description: 'npm dist-tag'
        required: true
        default: 'latest'
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup node
        uses: ./.github/actions/setup-node
        with:
          NODEJS_VERSION: '24'

      - name: Test packages
        run: |
          yarn workspace @nodebook/core test
          yarn workspace @nodebook/dom test
          yarn workspace @nodebook/markdown-it test

      - name: Build packages
        run: |
          yarn workspace @nodebook/core build
          yarn workspace @nodebook/react build
          yarn workspace @nodebook/dom build
          yarn workspace @nodebook/markdown-it build

      - name: Verify npm authentication
        run: yarn npm whoami --publish
        working-directory: packages/nodebook-core
        env:
          YARN_NPM_PUBLISH_REGISTRY: https://registry.npmjs.org
          YARN_NPM_ALWAYS_AUTH: 'true'
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        run: |
          if [ "${{ inputs.package }}" = "all" ]; then
            packages="@nodebook/core @nodebook/react @nodebook/dom @nodebook/markdown-it"
          else
            packages="${{ inputs.package }}"
          fi
          for pkg in $packages; do
            echo "::group::Publishing $pkg"
            yarn workspace "$pkg" npm publish --tag "${{ inputs.tag }}" --tolerate-republish
            echo "::endgroup::"
          done
        env:
          # Yarn's default registry is the read-only registry.yarnpkg.com
          # mirror; publishes must go to registry.npmjs.org.
          YARN_NPM_PUBLISH_REGISTRY: https://registry.npmjs.org
          YARN_NPM_ALWAYS_AUTH: 'true'
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
