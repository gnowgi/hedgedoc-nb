name: Publish nodeBook packages to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package(s) to publish'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - '@nodebook/core'
          - '@nodebook/react'
      tag:
        description: 'npm dist-tag'
        required: true
        default: 'latest'
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup node
        uses: ./.github/actions/setup-node
        with:
          NODEJS_VERSION: '24'

      - name: Test @nodebook/core
        run: yarn workspace @nodebook/core test

      - name: Build packages
        run: |
          yarn workspace @nodebook/core build
          yarn workspace @nodebook/react build

      # Yarn's default registry is the registry.yarnpkg.com mirror, which
      # rejects publishes; route them to registry.npmjs.org with the token.
      - name: Configure npm publish registry
        run: |
          yarn config set npmPublishRegistry "https://registry.npmjs.org"
          yarn config set 'npmRegistries["https://registry.npmjs.org"].npmAuthToken' "${NPM_TOKEN}"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nodebook/core
        if: ${{ inputs.package == 'both' || inputs.package == '@nodebook/core' }}
        run: yarn workspace @nodebook/core npm publish --tag "${{ inputs.tag }}" --tolerate-republish

      - name: Publish @nodebook/react
        if: ${{ inputs.package == 'both' || inputs.package == '@nodebook/react' }}
        run: yarn workspace @nodebook/react npm publish --tag "${{ inputs.tag }}" --tolerate-republish
